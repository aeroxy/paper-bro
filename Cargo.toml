[package]
name = "paper-bro"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chromiumoxide = "0.9.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
dotenvy = "0.15.7"
ego-tree = "0.11.1"
env_logger = "0.11.11"
fastrand = "2.5.0"
flate2 = "1.1.10"
futures = "0.3.34"
log = "0.4.34"
mime_guess = "2.0.5"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots"] }
roxmltree = "0.21.2"
rust-embed = "8.13.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "macros", "migrate"] }
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "fs"] }
